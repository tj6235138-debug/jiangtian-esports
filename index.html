<style>

<script>
const API_BASE =
  "https://telegram-bot-production-1a67.up.railway.app";

const tg = window.Telegram?.WebApp;

let initData = "";

let currentUser = null;
let account = null;

let fixtures = [];
let filteredFixtures = [];

let currentType = "live";
let currentSport = "全部";

let selectedBet = null;


/* ========================================
   Telegram 初始化
======================================== */

function initTelegram(){

  if(!tg){
    showFatal(
      "请从 Telegram 机器人内打开姜天电竞。"
    );
    return false;
  }

  tg.ready();
  tg.expand();

  initData = tg.initData || "";

  if(!initData){
    showFatal(
      "没有获取到 Telegram 登录信息，请关闭页面后从机器人重新进入。"
    );
    return false;
  }

  currentUser =
    tg.initDataUnsafe?.user || null;

  if(currentUser){
    renderTelegramUser(currentUser);
  }

  return true;
}


function renderTelegramUser(user){

  const displayName =
    user.first_name ||
    user.username ||
    "Telegram用户";

  document.getElementById(
    "username"
  ).textContent = displayName;

  document.getElementById(
    "profileUsername"
  ).textContent =
    user.username
      ? "@" + user.username
      : displayName;

  document.getElementById(
    "profileId"
  ).textContent =
    user.id || "--";

  const avatarWrap =
    document.getElementById("avatarWrap");

  if(user.photo_url){

    avatarWrap.outerHTML =
      `<img
        id="avatarWrap"
        class="avatar"
        src="${escapeHtml(user.photo_url)}"
        alt="avatar"
      >`;

  }else{

    avatarWrap.textContent =
      displayName
        .charAt(0)
        .toUpperCase();
  }
}


/* ========================================
   API
======================================== */

async function apiFetch(path, options = {}){

  const headers = {
    ...(options.headers || {})
  };

  if(initData){
    headers[
      "X-Telegram-Init-Data"
    ] = initData;
  }

  if(
    options.body &&
    !headers["Content-Type"]
  ){
    headers["Content-Type"] =
      "application/json";
  }

  const response =
    await fetch(
      API_BASE + path,
      {
        ...options,
        headers
      }
    );

  let data;

  try{
    data = await response.json();
  }catch{
    throw new Error(
      "服务器返回格式异常"
    );
  }

  if(!response.ok || data.ok === false){
    throw new Error(
      data.error ||
      "请求失败"
    );
  }

  return data;
}


/* ========================================
   登录账户
======================================== */

async function loadAccount(){

  try{

    const data =
      await apiFetch(
        "/api/user",
        {
          method:"POST",
          body:JSON.stringify({
            init_data:initData
          })
        }
      );

    account = data.user;

    updateAccountUI();

    document.getElementById(
      "authLoading"
    ).style.display = "none";

    await loadFixtures();

  }catch(error){

    showFatal(
      error.message ||
      "账户登录失败"
    );
  }
}


function updateAccountUI(){

  if(!account) return;

  const balance =
    Number(
      account.balance || 0
    );

  document.getElementById(
    "balance"
  ).textContent =
    balance.toLocaleString(
      "en-US",
      {
        minimumFractionDigits:2,
        maximumFractionDigits:2
      }
    ) + " USDT";

  document.getElementById(
    "profileBalance"
  ).textContent =
    balance.toFixed(2) +
    " USDT";

  document.getElementById(
    "profileId"
  ).textContent =
    account.telegram_id;

  const name =
    account.username
      ? "@" + account.username
      : (
          account.first_name ||
          "Telegram用户"
        );

  document.getElementById(
    "profileUsername"
  ).textContent = name;

  document.getElementById(
    "username"
  ).textContent =
    account.first_name ||
    account.username ||
    "玩家";

  if(account.photo_url){

    const old =
      document.getElementById(
        "avatarWrap"
      );

    if(old){

      old.outerHTML =
        `<img
          id="avatarWrap"
          class="avatar"
          src="${escapeHtml(account.photo_url)}"
          alt="avatar"
        >`;
    }
  }
}


/* ========================================
   比赛
======================================== */

async function loadFixtures(){

  const list =
    document.getElementById(
      "matchList"
    );

  list.innerHTML =
    `<div class="loader">
      正在加载赛事...
    </div>`;

  try{

    const data =
      await apiFetch(
        "/api/fixtures?event_type=" +
        encodeURIComponent(
          currentType
        ) +
        "&limit=50"
      );

    fixtures =
      Array.isArray(data.events)
        ? data.events
        : [];

    document.getElementById(
      "eventCount"
    ).textContent =
      fixtures.length;

    buildSports();

    filterFixtures();

  }catch(error){

    list.innerHTML =
      `<div class="empty">
        赛事加载失败<br><br>
        ${escapeHtml(error.message)}
      </div>`;
  }
}


function buildSports(){

  const sports = [
    ...new Set(
      fixtures
        .map(
          e =>
            e.sport ||
            e.category
        )
        .filter(Boolean)
    )
  ];

  const container =
    document.getElementById(
      "sports"
    );

  let html =
    `<button
      class="sport ${
        currentSport === "全部"
          ? "active"
          : ""
      }"
      onclick="selectSport('全部')">
      全部
    </button>`;

  sports.forEach(sport=>{

    const icon =
      getSportIcon(sport);

    html +=
      `<button
        class="sport ${
          currentSport === sport
            ? "active"
            : ""
        }"
        onclick='selectSport(${JSON.stringify(sport)})'>
        ${icon}
        ${escapeHtml(sport)}
      </button>`;
  });

  container.innerHTML = html;
}


function getSportIcon(sport){

  const s =
    String(sport).toLowerCase();

  if(s.includes("dota"))
    return "🛡️";

  if(
    s.includes("cs") ||
    s.includes("counter")
  )
    return "🎯";

  if(
    s.includes("lol") ||
    s.includes("league")
  )
    return "⚔️";

  if(
    s.includes("rainbow") ||
    s.includes("r6")
  )
    return "🔫";

  return "🎮";
}


function selectSport(sport){

  currentSport = sport;

  buildSports();
  filterFixtures();
}


function filterFixtures(){

  if(currentSport === "全部"){

    filteredFixtures =
      fixtures;

  }else{

    filteredFixtures =
      fixtures.filter(
        event =>
          (
            event.sport ||
            event.category
          ) === currentSport
      );
  }

  renderFixtures();
}


function switchEventType(type){

  currentType = type;
  currentSport = "全部";

  document.getElementById(
    "tabLive"
  ).classList.toggle(
    "active",
    type === "live"
  );

  document.getElementById(
    "tabPrematch"
  ).classList.toggle(
    "active",
    type === "prematch"
  );

  document.getElementById(
    "sectionTitle"
  ).textContent =
    type === "live"
      ? "🔥 实时赛事"
      : "🕘 赛前赛事";

  loadFixtures();
}


/* ========================================
   渲染比赛
======================================== */

function renderFixtures(){

  const list =
    document.getElementById(
      "matchList"
    );

  if(!filteredFixtures.length){

    list.innerHTML =
      `<div class="empty">
        暂无可用赛事
      </div>`;

    return;
  }

  list.innerHTML =
    filteredFixtures
      .map(
        (event,index) =>
          renderEvent(
            event,
            index
          )
      )
      .join("");
}


function getTeams(event){

  let home =
    event.home ||
    event.home_team ||
    "";

  let away =
    event.away ||
    event.away_team ||
    "";

  const competitors =
    Array.isArray(
      event.competitors
    )
      ? event.competitors
      : [];

  if(competitors.length){

    const homeComp =
      competitors.find(
        x =>
          x.is_home === true
      );

    const awayComp =
      competitors.find(
        x =>
          x.is_home === false
      );

    home =
      homeComp?.name ||
      competitors[0]?.name ||
      home ||
      "主队";

    away =
      awayComp?.name ||
      competitors[1]?.name ||
      away ||
      "客队";
  }

  return {
    home,
    away
  };
}


function renderEvent(event,index){

  const teams =
    getTeams(event);

  const league =
    event.league ||
    event.competition ||
    event.category ||
    "电竞赛事";

  const sport =
    event.sport ||
    event.category ||
    "Esports";

  const markets =
    Array.isArray(
      event.markets
    )
      ? event.markets
      : [];

  let marketsHtml = "";

  markets
    .slice(0,4)
    .forEach(
      (market,marketIndex)=>{

        const selections =
          Array.isArray(
            market.selections
          )
            ? market.selections
            : [];

        const valid =
          selections.filter(
            s =>
              Number(s.price) > 1
          );

        if(!valid.length)
          return;

        marketsHtml +=
          `<div class="market-title">
            ${escapeHtml(
              market.market ||
              market.canonical ||
              "盘口"
            )}
          </div>`;

        marketsHtml +=
          `<div class="odds-grid">`;

        valid
          .slice(0,6)
          .forEach(
            (selection,selectionIndex)=>{

              const name =
                selection.name ||
                selection.side ||
                "选择";

              const price =
                Number(
                  selection.price
                );

              marketsHtml +=
                `<button
                  class="odd"
                  onclick="chooseBet(
                    ${index},
                    ${marketIndex},
                    ${selectionIndex}
                  )"
                >
                  <div class="odd-name">
                    ${escapeHtml(name)}
                  </div>

                  <div class="odd-price">
                    ${price.toFixed(2)}
                  </div>
                </button>`;
            }
          );

        marketsHtml +=
          `</div>`;
      }
    );

  if(!marketsHtml){

    marketsHtml =
      `<div class="market-title">
        当前暂无开放盘口
      </div>`;
  }

  const score =
    event.score || {};

  const homeScore =
    score.home ??
    "";

  const awayScore =
    score.away ??
    "";

  return `
    <div class="match">

      <div class="match-head">

        <div class="league">
          ${getSportIcon(sport)}
          ${escapeHtml(sport)}
          ·
          ${escapeHtml(
            String(league)
          )}
        </div>

        <div class="${
          currentType === "live"
            ? "live"
            : "prematch"
        }">
          ${
            currentType === "live"
              ? "● LIVE"
              : "PRE"
          }
        </div>

      </div>

      <div class="teams">

        <div class="team">
          <span>
            ${escapeHtml(teams.home)}
          </span>

          <span class="score">
            ${escapeHtml(
              String(homeScore)
            )}
          </span>
        </div>

        <div class="team">
          <span>
            ${escapeHtml(teams.away)}
          </span>

          <span class="score">
            ${escapeHtml(
              String(awayScore)
            )}
          </span>
        </div>

      </div>

      ${marketsHtml}

    </div>
  `;
}


/* ========================================
   选择投注
======================================== */

function chooseBet(
  eventIndex,
  marketIndex,
  selectionIndex
){

  const event =
    filteredFixtures[
      eventIndex
    ];

  if(!event)
    return;

  const market =
    event.markets?.[
      marketIndex
    ];

  if(!market)
    return;

  const validSelections =
    (
      market.selections || []
    ).filter(
      s =>
        Number(s.price) > 1
    );

  const selection =
    validSelections[
      selectionIndex
    ];

  if(!selection)
    return;

  const teams =
    getTeams(event);

  selectedBet = {

    event_id:
      event.event_id ||
      event.id ||
      "",

    sport:
      event.sport ||
      event.category ||
      "",

    league:
      event.league ||
      event.competition ||
      "",

    home_team:
      teams.home,

    away_team:
      teams.away,

    market:
      market.market ||
      market.canonical ||
      "盘口",

    selection:
      selection.name ||
      selection.side ||
      "选择",

    odds:
      Number(
        selection.price
      )
  };

  renderSlip();
  openBetModal();
}


function renderSlip(){

  const container =
    document.getElementById(
      "slipContent"
    );

  if(!selectedBet){

    container.innerHTML =
      `<div class="empty">
        暂无选择<br><br>
        请在赛事赔率中选择一个盘口
      </div>`;

    return;
  }

  container.innerHTML = `
    <div class="bet-card">

      <div class="bet-market">
        ${escapeHtml(
          selectedBet.market
        )}
      </div>

      <div class="bet-match">
        ${escapeHtml(
          selectedBet.home_team
        )}
        VS
        ${escapeHtml(
          selectedBet.away_team
        )}
      </div>

      <div class="bet-selection">
        ${escapeHtml(
          selectedBet.selection
        )}

        <b style="color:#ffd45d">
          @
          ${selectedBet.odds.toFixed(2)}
        </b>
      </div>

      <button
        class="btn btn-gold"
        style="width:100%;margin-top:16px"
        onclick="openBetModal()"
      >
        立即模拟投注
      </button>

    </div>
  `;
}


/* ========================================
   投注弹窗
======================================== */

function openBetModal(){

  if(!selectedBet)
    return;

  document.getElementById(
    "modalMatch"
  ).textContent =
    selectedBet.home_team +
    " VS " +
    selectedBet.away_team;

  document.getElementById(
    "modalSelection"
  ).textContent =
    selectedBet.market +
    " · " +
    selectedBet.selection;

  document.getElementById(
    "modalOdds"
  ).textContent =
    "赔率 " +
    selectedBet.odds.toFixed(2);

  document.getElementById(
    "stakeInput"
  ).value = "";

  document.getElementById(
    "returnValue"
  ).textContent =
    "0.00 USDT";

  document.getElementById(
    "betModal"
  ).classList.add(
    "show"
  );
}


function closeBetModal(){

  document.getElementById(
    "betModal"
  ).classList.remove(
    "show"
  );
}


function quickStake(amount){

  document.getElementById(
    "stakeInput"
  ).value = amount;

  calculateReturn();
}


function calculateReturn(){

  if(!selectedBet)
    return;

  const stake =
    Number(
      document.getElementById(
        "stakeInput"
      ).value
    ) || 0;

  const value =
    stake *
    selectedBet.odds;

  document.getElementById(
    "returnValue"
  ).textContent =
    value.toFixed(2) +
    " USDT";
}


/* ========================================
   提交投注
======================================== */

async function submitBet(){

  if(!selectedBet)
    return;

  const stake =
    Number(
      document.getElementById(
        "stakeInput"
      ).value
    );

  if(!stake || stake <= 0){

    toast(
      "请输入正确的投注金额"
    );

    return;
  }

  const button =
    document.getElementById(
      "submitBetBtn"
    );

  button.disabled = true;
  button.textContent =
    "正在提交...";

  try{

    const data =
      await apiFetch(
        "/api/bet",
        {
          method:"POST",
          body:JSON.stringify({
            ...selectedBet,
            stake:stake,
            init_data:initData
          })
        }
      );

    if(account){
      account.balance =
        data.balance;
    }

    updateAccountUI();

    closeBetModal();

    selectedBet = null;

    renderSlip();

    toast(
      "✅ 模拟投注成功"
    );

    await loadBets();

  }catch(error){

    toast(
      error.message ||
      "投注失败"
    );

  }finally{

    button.disabled = false;
    button.textContent =
      "确认模拟投注";
  }
}


/* ========================================
   我的投注
======================================== */

async function loadBets(){

  const container =
    document.getElementById(
      "betsList"
    );

  container.innerHTML =
    `<div class="loader">
      正在读取投注记录...
    </div>`;

  try{

    const data =
      await apiFetch(
        "/api/bets"
      );

    const bets =
      Array.isArray(
        data.bets
      )
        ? data.bets
        : [];

    if(!bets.length){

      container.innerHTML =
        `<div class="empty">
          暂无投注记录
        </div>`;

      return;
    }

    container.innerHTML =
      bets.map(
        bet =>
          renderBet(bet)
      ).join("");

  }catch(error){

    container.innerHTML =
      `<div class="empty">
        ${escapeHtml(
          error.message
        )}
      </div>`;
  }
}


function renderBet(bet){

  const statusMap = {
    pending:"待结算",
    won:"已赢",
    lost:"未赢",
    void:"已取消"
  };

  return `
    <div class="bet-card">

      <div class="bet-top">

        <div class="bet-market">
          ${escapeHtml(
            bet.market || "盘口"
          )}
        </div>

        <div class="bet-status">
          ${
            statusMap[
              bet.status
            ] ||
            bet.status
          }
        </div>

      </div>

      <div class="bet-match">
        ${escapeHtml(
          bet.home_team || ""
        )}
        VS
        ${escapeHtml(
          bet.away_team || ""
        )}
      </div>

      <div class="bet-selection">
        ${escapeHtml(
          bet.selection || ""
        )}
      </div>

      <div class="bet-numbers">

        <div class="number">
          赔率
          <b>
            ${Number(
              bet.odds
            ).toFixed(2)}
          </b>
        </div>

        <div class="number">
          投注
          <b>
            ${Number(
              bet.stake
            ).toFixed(2)}
          </b>
        </div>

        <div class="number">
          预计返还
          <b>
            ${Number(
              bet.potential_return
            ).toFixed(2)}
          </b>
        </div>

      </div>

    </div>
  `;
}


/* ========================================
   页面
======================================== */

function showPage(page){

  document
    .querySelectorAll(".page")
    .forEach(
      el =>
        el.classList.remove(
          "active"
        )
    );

  document
    .querySelectorAll(".nav")
    .forEach(
      el =>
        el.classList.remove(
          "active"
        )
    );

  document.getElementById(
    "page-" + page
  ).classList.add(
    "active"
  );

  document.getElementById(
    "nav-" + page
  ).classList.add(
    "active"
  );

  if(page === "bets"){
    loadBets();
  }

  window.scrollTo(
    0,
    0
  );
}

   模拟充值
======================================== */

function demoRecharge(){

  toast(
    "模拟充值功能下一步接入"
  );
}


/* ========================================
   工具
======================================== */

function escapeHtml(value){

  return String(
    value ?? ""
  )
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );
}


function toast(message){

  const el =
    document.getElementById(
      "toast"
    );

  el.textContent = message;

  el.classList.add(
    "show"
  );

  setTimeout(
    ()=>{
      el.classList.remove(
        "show"
      );
    },
    2500
  );
}


function showFatal(message){

  const loading =
    document.getElementById(
      "authLoading"
    );

  loading.innerHTML = `
    <div class="auth-logo">!</div>

    <div class="auth-title">
      无法进入
    </div>

    <div
      class="auth-text"
      style="
        max-width:280px;
        text-align:center;
        line-height:1.7
      "
    >
      ${escapeHtml(message)}
    </div>
  `;
}

   启动
======================================== */

async function boot(){

  const ok =
    initTelegram();

  if(!ok)
    return;

  await loadAccount();
}

boot();
