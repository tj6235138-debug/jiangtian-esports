<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#08090c">
<title>姜天电竞</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
:root{
  --bg:#08090c;
  --card:#111318;
  --card2:#171a20;
  --gold:#f2c75c;
  --text:#f5f5f5;
  --muted:#8e939d;
  --line:#262a33;
  --green:#2ecc71;
  --red:#ff5c5c;
  --blue:#55a8ff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;
  padding-bottom:85px;
}
button,input{font:inherit}
button{cursor:pointer}
.app{max-width:620px;margin:auto;min-height:100vh}

.header{padding:20px 20px 14px;border-bottom:1px solid var(--line)}
.brandrow{display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:12px}
.logo{
  width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#ffd966,#d59e20);color:#111;font-size:28px;font-weight:900
}
.brand-title{font-size:23px;font-weight:800}
.brand-sub{margin-top:4px;color:var(--muted);font-size:11px;letter-spacing:2px}
.userbox{display:flex;align-items:center;gap:8px}
.username{font-size:13px;color:#ddd;max-width:105px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.avatar{width:42px;height:42px;border-radius:50%;border:1px solid #5c4930;object-fit:cover;background:#252832}
.avatar-fallback{
  width:42px;height:42px;border-radius:50%;background:#282b32;display:flex;align-items:center;
  justify-content:center;font-weight:800;color:var(--gold);border:1px solid #5c4930
}

.balance-card{
  margin:18px 20px;padding:22px;border-radius:25px;border:1px solid #5b4720;
  background:radial-gradient(circle at top right,rgba(242,199,92,.14),transparent 40%),
  linear-gradient(135deg,#15171b,#101115)
}
.small{color:#c8ccd4;font-size:14px}
.demo{margin-left:6px;padding:3px 7px;border-radius:6px;color:#f7ce55;background:#312b1c;font-size:11px}
.balance{margin-top:18px;font-size:24px;font-weight:900;color:#ffd25d;letter-spacing:1px}
.balance-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}
.btn{border:0;border-radius:15px;padding:14px 10px;font-weight:800}
.btn-gold{background:linear-gradient(135deg,#ffd665,#e8b63c);color:#111}
.btn-dark{background:#252832;color:white}

.statusbar{
  margin:0 20px 16px;padding:13px 16px;background:#111318;border:1px solid var(--line);
  border-radius:17px;color:#bbbfc7;font-size:13px
}
.dot{
  display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--red);
  margin-right:8px;box-shadow:0 0 10px var(--red)
}

.tabs{
  display:grid;grid-template-columns:1fr 1fr;margin:0 20px;padding:6px;
  background:#101217;border:1px solid var(--line);border-radius:18px
}
.tab{padding:13px;border:0;border-radius:14px;background:transparent;color:#90959f;font-weight:800}
.tab.active{background:linear-gradient(135deg,#ffd665,#e7b43d);color:#111}

.sports{display:flex;overflow-x:auto;gap:9px;padding:14px 20px 5px;scrollbar-width:none}
.sports::-webkit-scrollbar{display:none}
.sport{
  flex:0 0 auto;padding:10px 16px;border:1px solid #2b2f38;border-radius:22px;
  background:#111318;color:#aeb2ba
}
.sport.active{color:#ffd55d;border-color:#876919;background:#1a1811}

.section-head{padding:17px 20px 10px;display:flex;justify-content:space-between;align-items:center}
.section-title{font-size:19px;font-weight:900}
.refresh{color:#ffd65e;font-size:13px;cursor:pointer}
.list{padding:0 20px}

.match{border:1px solid var(--line);background:var(--card);border-radius:19px;margin-bottom:13px;overflow:hidden}
.match-head{padding:14px 16px 9px;display:flex;justify-content:space-between;gap:10px}
.league{color:#bfc4cd;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.live{
  flex:0 0 auto;background:#3a1d21;color:#ff7373;border-radius:8px;padding:5px 8px;
  font-size:10px;font-weight:800
}
.prematch{
  flex:0 0 auto;background:#182635;color:#7dbdff;border-radius:8px;padding:5px 8px;
  font-size:10px;font-weight:800
}
.teams{padding:7px 16px 12px}
.team{display:flex;justify-content:space-between;padding:7px 0;font-size:16px;font-weight:800}
.score{color:#ffd55e}

.market-title{
  padding:10px 16px;border-top:1px solid #22262e;color:#9197a2;font-size:12px;
  display:flex;justify-content:space-between;gap:10px
}
.odds-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:0 14px 14px}
.odd{
  border:1px solid #2c3039;border-radius:12px;background:#181b21;color:#ddd;
  padding:11px;text-align:left
}
.odd:active{transform:scale(.98)}
.odd-name{font-size:12px;color:#aeb3bc;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.odd-price{margin-top:5px;color:#ffd45d;font-weight:900;font-size:16px}

.empty{padding:45px 20px;text-align:center;color:#858a94}
.loader{padding:45px;text-align:center;color:#c9cbd0}

.bottom{
  position:fixed;left:0;right:0;bottom:0;z-index:20;
  background:rgba(9,10,13,.97);border-top:1px solid #22262d
}
.bottom-inner{max-width:620px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav{text-align:center;padding:12px 5px 10px;color:#777d87;cursor:pointer;font-size:11px}
.nav-icon{font-size:21px;margin-bottom:4px}
.nav.active{color:#f3c750}
.page{display:none}
.page.active{display:block}

.profile{margin:20px;background:#111318;border:1px solid var(--line);border-radius:20px;padding:20px}
.profile-row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #22262e;gap:20px}
.profile-row:last-child{border-bottom:0}
.profile-label{color:#8e939d}

.bet-card{background:#111318;border:1px solid var(--line);border-radius:17px;padding:16px;margin-bottom:12px}
.bet-top{display:flex;justify-content:space-between;gap:10px}
.bet-market{font-weight:800}
.bet-status{font-size:11px;color:#f2c75c}
.bet-match{margin-top:8px;color:#989da6;font-size:12px}
.bet-selection{margin-top:11px;color:white}
.bet-numbers{margin-top:13px;display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.number{background:#191c22;padding:9px;border-radius:10px;font-size:11px;color:#999fa8}
.number b{display:block;color:#f1f1f1;margin-top:3px;font-size:13px}

.modal{
  display:none;position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.7);
  align-items:flex-end;justify-content:center
}
.modal.show{display:flex}
.sheet{
  width:100%;max-width:620px;background:#121419;border-radius:25px 25px 0 0;
  border-top:1px solid #3a3e47;padding:22px 20px 28px
}
.sheet-title{font-size:19px;font-weight:900}
.sheet-match{margin-top:10px;color:#9fa4ad;font-size:13px}
.selected{margin-top:15px;background:#1b1e24;border:1px solid #30343d;border-radius:15px;padding:14px}
.selected-name{color:#ddd}
.selected-odds{color:#ffd45d;font-weight:900;margin-top:6px}
.amount-label{margin-top:18px;color:#a3a7af;font-size:13px}
.amount{
  width:100%;margin-top:8px;border:1px solid #363a44;background:#0c0d10;color:white;
  border-radius:13px;padding:14px;font-size:18px;outline:none
}
.quick{display:flex;gap:7px;margin-top:9px}
.quick button{
  flex:1;padding:8px;border-radius:9px;border:1px solid #30343d;background:#1a1d23;color:#bbbfc7
}
.return-box{display:flex;justify-content:space-between;margin-top:15px;color:#aaaeb7}
.return-value{color:#ffd45d;font-weight:900}
.sheet-actions{display:grid;grid-template-columns:1fr 2fr;gap:10px;margin-top:20px}

.errorbox{
  display:none;margin:15px 20px;padding:13px;border:1px solid #5c282d;
  background:#2b171a;color:#ff9696;border-radius:12px;font-size:12px
}
.toast{
  position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-100px);
  background:#252932;color:white;padding:12px 18px;border-radius:12px;z-index:100;
  transition:.25s;max-width:85%;text-align:center
}
.toast.show{transform:translateX(-50%) translateY(0)}

.auth-loading{
  position:fixed;inset:0;background:#08090c;z-index:200;display:flex;
  align-items:center;justify-content:center;flex-direction:column
}
.auth-logo{
  width:70px;height:70px;border-radius:22px;background:linear-gradient(135deg,#ffd966,#d59e20);
  color:#111;display:flex;align-items:center;justify-content:center;font-size:37px
}
.auth-title{margin-top:17px;font-weight:900;font-size:21px}
.auth-text{color:#888e98;margin-top:7px;font-size:12px}

@media(max-width:380px){
  .brand-title{font-size:20px}
  .logo{width:47px;height:47px}
  .username{max-width:80px}
}
</style>
</head>

<body>

<script>

const API_BASE =
  "https://telegram-bot-production-1a67.up.railway.app";

const tg = window.Telegram?.WebApp;

let initData = "";
let currentUser = null;
let account = null;

let fixtures = [];
let filteredFixtures = [];

let currentType = "live";
let currentSport = "全部";
let selectedBet = null;


/* =========================================================
   中文翻译
========================================================= */

function normalizeText(value){
  return String(value ?? "").trim();
}

function lowerText(value){
  return normalizeText(value).toLowerCase();
}


/* 游戏名称：电竞项目正式缩写保留 */
function translateSport(value){

  const raw = normalizeText(value);
  const s = raw.toLowerCase();

  const map = {
    "league of legends":"LOL",
    "lol":"LOL",
    "counter-strike 2":"CS2",
    "counter strike 2":"CS2",
    "cs2":"CS2",
    "counter-strike":"CS",
    "csgo":"CS",
    "dota 2":"DOTA2",
    "dota2":"DOTA2",
    "valorant":"无畏契约",
    "rainbow six":"彩虹六号",
    "rainbow six siege":"彩虹六号",
    "rainbow six: siege":"彩虹六号",
    "r6":"彩虹六号",
    "overwatch":"守望先锋",
    "overwatch 2":"守望先锋2",
    "starcraft 2":"星际争霸2",
    "starcraft ii":"星际争霸2",
    "call of duty":"使命召唤"
  };

  return map[s] || raw;
}


/* 盘口名称中文化 */
function translateMarket(value){

  const raw = normalizeText(value);

  if(!raw) return "比赛盘口";

  const s = raw
    .toLowerCase()
    .replaceAll("_"," ")
    .replaceAll("-"," ")
    .replace(/\s+/g," ")
    .trim();

  const exact = {
    "match winner":"比赛胜负",
    "match winner twoway":"比赛胜负",
    "match winner two way":"比赛胜负",
    "moneyline":"比赛胜负",
    "money line":"比赛胜负",

    "map winner":"地图胜负",
    "map 1 winner":"第1地图胜负",
    "map 2 winner":"第2地图胜负",
    "map 3 winner":"第3地图胜负",
    "map 4 winner":"第4地图胜负",
    "map 5 winner":"第5地图胜负",

    "match handicap":"比赛让分",
    "map handicap":"地图让分",
    "maps handicap":"地图让分",

    "total maps":"总地图数",
    "total rounds":"总回合数",
    "total kills":"总击杀数",
    "total games":"总局数",

    "first map winner":"第1地图胜负",
    "second map winner":"第2地图胜负",
    "third map winner":"第3地图胜负",

    "correct score":"正确比分",
    "match score":"比赛比分",

    "first blood":"一血",
    "first tower":"一塔",
    "first dragon":"第一条小龙",
    "first baron":"第一条大龙",
    "first inhibitor":"第一座高地",

    "race to 5 kills":"率先达到5击杀",
    "race to 10 kills":"率先达到10击杀",
    "race to 15 kills":"率先达到15击杀",
    "race to 20 kills":"率先达到20击杀"
  };

  if(exact[s]){
    return exact[s];
  }

  let mapNumber = s.match(/map\s*(\d+)/);

  if(mapNumber){

    const n = mapNumber[1];

    if(s.includes("winner")){
      return `第${n}地图胜负`;
    }

    if(s.includes("handicap")){
      return `第${n}地图让分`;
    }

    if(s.includes("total")){
      return `第${n}地图大小`;
    }

    if(s.includes("kills")){
      return `第${n}地图击杀数`;
    }

    if(s.includes("rounds")){
      return `第${n}地图回合数`;
    }
  }

  if(
    s.includes("handicap") ||
    s.includes("spread")
  ){
    return "让分盘口";
  }

  if(
    s.includes("total") &&
    s.includes("kill")
  ){
    return "总击杀数";
  }

  if(
    s.includes("total") &&
    s.includes("round")
  ){
    return "总回合数";
  }

  if(
    s.includes("total") &&
    s.includes("map")
  ){
    return "总地图数";
  }

  if(s.includes("winner")){
    return "胜负";
  }

  if(s.includes("kills")){
    return "击杀数";
  }

  if(s.includes("rounds")){
    return "回合数";
  }

  if(s.includes("maps")){
    return "地图数";
  }

  /* 无法识别时保留原始盘口，避免翻错 */
  return raw;
}


/* 投注选项中文化 */
function translateSelection(value){

  const raw = normalizeText(value);

  if(!raw) return "选项";

  const s = raw.toLowerCase().trim();

  const exact = {
    "home":"主队",
    "away":"客队",
    "draw":"平局",
    "tie":"平局",

    "yes":"是",
    "no":"否",

    "over":"大",
    "under":"小",

    "odd":"单数",
    "even":"双数",

    "team 1":"队伍1",
    "team 2":"队伍2",
    "player 1":"选手1",
    "player 2":"选手2",

    "1":"主队",
    "2":"客队",

    "win":"获胜",
    "lose":"落败"
  };

  if(exact[s]){
    return exact[s];
  }

  /* Over 2.5 */
  let match = raw.match(/^over\s+(.+)$/i);

  if(match){
    return "大 " + match[1];
  }

  /* Under 2.5 */
  match = raw.match(/^under\s+(.+)$/i);

  if(match){
    return "小 " + match[1];
  }

  /* Home +1.5 */
  match = raw.match(/^home\s+(.+)$/i);

  if(match){
    return "主队 " + match[1];
  }

  /* Away -1.5 */
  match = raw.match(/^away\s+(.+)$/i);

  if(match){
    return "客队 " + match[1];
  }

  /* Team 1 +1.5 */
  match = raw.match(/^team\s*1\s+(.+)$/i);

  if(match){
    return "队伍1 " + match[1];
  }

  match = raw.match(/^team\s*2\s+(.+)$/i);

  if(match){
    return "队伍2 " + match[1];
  }

  /*
    如果 selection 本身就是战队名称，
    不翻译，保持官方队名。
  */
  return raw;
}


/* 投注状态 */
function translateBetStatus(value){

  const s = lowerText(value);

  const map = {
    "pending":"待结算",
    "open":"待结算",
    "active":"进行中",
    "won":"已赢",
    "win":"已赢",
    "lost":"已输",
    "lose":"已输",
    "void":"已取消",
    "cancelled":"已取消",
    "canceled":"已取消",
    "refunded":"已退款",
    "settled":"已结算"
  };

  return map[s] || value || "待结算";
}


/* =========================================================
   Telegram
========================================================= */

function initTelegram(){

  if(!tg){

    showFatal(
      "请从 Telegram 机器人内打开姜天电竞。"
    );

    return false;
  }

  tg.ready();
  tg.expand();

  initData = tg.initData || "";

  if(!initData){

    showFatal(
      "没有获取到 Telegram 登录信息，请关闭页面后从机器人重新进入。"

/* =========================================================
   API
========================================================= */

async function apiFetch(path,options={}){

  const headers = {
    ...(options.headers || {})
  };

  if(initData){

    headers[
      "X-Telegram-Init-Data"
    ] = initData;
  }

  if(
    options.body &&
    !headers["Content-Type"]
  ){

    headers["Content-Type"] =
      "application/json";
  }

  const response =
    await fetch(
      API_BASE + path,
      {
        ...options,
        headers
      }
    );

  let data;

  try{

    data =
      await response.json();

  }catch{

    throw new Error(
      "服务器返回格式异常"
    );
  }

  if(
    !response.ok ||
    data.ok === false
  ){

    throw new Error(
      data.error ||
      "请求失败"
    );
  }

  return data;
}

/* =========================================================
   获取赛事
========================================================= */

async function loadFixtures(){

  const list =
    document.getElementById(
      "matchList"
    );

  list.innerHTML =
    `<div class="loader">
      正在加载赛事...
    </div>`;

        encodeURIComponent(
          currentType

      Array.isArray(

      )
        ? data.events

/* =========================================================
   游戏分类
========================================================= */

function buildSports(){

  const sports = [
    ...new Set(
      fixtures
        .map(
          event =>
            event.sport ||
            event.category
        )
        .filter(Boolean)
    )
  ];

  const container =
    document.getElementById(
      "sports"
    );

  let html =
    `<button
      class="sport ${
        currentSport === "全部"
          ? "active"
          : ""
      }"
      onclick="selectSport('全部')">
      全部
    </button>`;

  sports.forEach(sport=>{

    html +=
      `<button
        class="sport ${
          currentSport === sport
            ? "active"
            : ""
        }"
        onclick='selectSport(${JSON.stringify(sport)})'>
        ${getSportIcon(sport)}
        ${escapeHtml(
          translateSport(sport)
        )}
      </button>`;
  });

  container.innerHTML = html;
}


function getSportIcon(sport){

  const s =
    String(
      sport || ""
    ).toLowerCase();

  if(s.includes("dota"))
    return "🛡️";

  if(
    s.includes("cs") ||
    s.includes("counter")
  )
    return "🎯";

  if(
    s.includes("lol") ||
    s.includes("league")
  )
    return "⚔️";

  if(
    s.includes("rainbow") ||
    s.includes("r6")
  )
    return "🔫";

  if(
    s.includes("valorant")
  )
    return "🔥";

  return "🎮";
}


function selectSport(sport){

  currentSport = sport;

  buildSports();
  filterFixtures();
}


function filterFixtures(){

  if(
    currentSport === "全部"
  ){

    filteredFixtures =
      fixtures;

  }else{

    filteredFixtures =
      fixtures.filter(
        event =>
          (
            event.sport ||
            event.category
          ) === currentSport
      );
  }

  renderFixtures();
}


function switchEventType(type){

  currentType = type;
  currentSport = "全部";

  document.getElementById(
    "tabLive"
  ).classList.toggle(
    "active",
    type === "live"
  );

  document.getElementById(
    "tabPrematch"
  ).classList.toggle(
    "active",
    type === "prematch"
  );

  document.getElementById(
    "sectionTitle"
  ).textContent =
    type === "live"
      ? "🔥 实时赛事"
      : "🕘 赛前赛事";

  loadFixtures();
}


/* =========================================================
   队伍
========================================================= */

function getTeams(event){

  let home =
    event.home ||
    event.home_team ||
    "";

  let away =
    event.away ||
    event.away_team ||
    "";

  const competitors =
    Array.isArray(
      event.competitors
    )
      ? event.competitors
      : [];

  if(competitors.length){

    const homeComp =
      competitors.find(
        x =>
          x.is_home === true
      );

    const awayComp =
      competitors.find(
        x =>
          x.is_home === false
      );

    home =
      homeComp?.name ||
      competitors[0]?.name ||
      home ||
      "主队";

    away =
      awayComp?.name ||
      competitors[1]?.name ||
      away ||
      "客队";
  }

  return {
    home,
    away
  };
}


/* =========================================================
   渲染赛事
========================================================= */

function renderFixtures(){

  const list =
    document.getElementById(
      "matchList"
    );

  if(!filteredFixtures.length){

    list.innerHTML =
      `<div class="empty">
        当前暂无可用赛事
      </div>`;

    return;
  }

  list.innerHTML =
    filteredFixtures
      .map(
        (event,index) =>
          renderEvent(
            event,
            index
          )
      )
      .join("");
}


function renderEvent(event,index){

  const teams =
    getTeams(event);

  /*
    联赛名称可能是官方赛事专有名称，
    不强制翻译，避免显示错误。
  */
  const league =
    event.league ||
    event.competition ||
    event.category ||
    "电竞赛事";

  const sport =
    event.sport ||
    event.category ||
    "电竞";

  const markets =
    Array.isArray(
      event.markets
    )
      ? event.markets
      : [];

  let marketsHtml = "";

  markets
    .slice(0,4)
    .forEach(
      (market,marketIndex)=>{

        const selections =
          Array.isArray(
            market.selections
          )
            ? market.selections
            : [];

        const valid =
          selections.filter(
            selection =>
              Number(
                selection.price
              ) > 1
          );

        if(!valid.length)
          return;

        const marketRaw =
          market.market ||
          market.canonical ||
          "比赛盘口";

        marketsHtml +=
          `<div class="market-title">
            <span>
              ${escapeHtml(
                translateMarket(
                  marketRaw
                )
              )}
            </span>

            <span>
              可下注
            </span>
          </div>`;

        marketsHtml +=
          `<div class="odds-grid">`;

        valid
          .slice(0,6)
          .forEach(
            (selection,selectionIndex)=>{

              const rawName =
                selection.name ||
                selection.side ||
                "选项";

              let displayName =
                translateSelection(
                  rawName
                );

              /*
                line单独返回时添加到选项后面。
              */
              if(
                selection.line !== null &&
                selection.line !== undefined &&
                selection.line !== "" &&
                !displayName.includes(
                  String(selection.line)
                )
              ){

                displayName +=
                  " " +
                  selection.line;
              }

              const price =
                Number(
                  selection.price
                );

              marketsHtml +=
                `<button
                  class="odd"
                  onclick="chooseBet(
                    ${index},
                    ${marketIndex},
                    ${selectionIndex}
                  )"
                >

                  <div class="odd-name">
                    ${escapeHtml(
                      displayName
                    )}
                  </div>

                  <div class="odd-price">
                    ${price.toFixed(2)}
                  </div>

                </button>`;
            }
          );

        marketsHtml +=
          `</div>`;
      }
    );

  if(!marketsHtml){

    marketsHtml =
      `<div class="market-title">
        <span>当前暂无开放盘口</span>
      </div>`;
  }

  const score =
    event.score || {};

  const homeScore =
    score.home ?? "";

  const awayScore =
    score.away ?? "";

  return `
    <div class="match">

      <div class="match-head">

        <div class="league">

          ${getSportIcon(sport)}

          ${escapeHtml(
            translateSport(sport)
          )}

          ·

          ${escapeHtml(
            String(league)
          )}

        </div>

        <div class="${
          currentType === "live"
            ? "live"
            : "prematch"
        }">

          ${
            currentType === "live"
              ? "● 滚球中"
              : "赛前"
          }

        </div>

      </div>

      <div class="teams">

        <div class="team">

          <span>
            ${escapeHtml(
              teams.home
            )}
          </span>

          <span class="score">
            ${escapeHtml(
              String(
                homeScore
              )
            )}
          </span>

        </div>

        <div class="team">

          <span>
            ${escapeHtml(
              teams.away
            )}
          </span>

          <span class="score">
            ${escapeHtml(
              String(
                awayScore
              )
            )}
          </span>

        </div>

      </div>

      ${marketsHtml}

    </div>
  `;
}


/* =========================================================
   选择盘口
========================================================= */

function chooseBet(
  eventIndex,
  marketIndex,
  selectionIndex
){

  const event =
    filteredFixtures[
      eventIndex
    ];

  if(!event)
    return;

  const market =
    event.markets?.[
      marketIndex
    ];

  if(!market)
    return;

  /*
    必须与renderEvent使用相同过滤，
    保证点击索引正确。
  */
  const validSelections =
    (
      market.selections || []
    ).filter(
      selection =>
        Number(
          selection.price
        ) > 1
    );

  const selection =
    validSelections[
      selectionIndex
    ];

  if(!selection)
    return;

  const teams =
    getTeams(event);

  const rawSelection =
    selection.name ||
    selection.side ||
    "选项";

  let selectionChinese =
    translateSelection(
      rawSelection
    );

  if(
    selection.line !== null &&
    selection.line !== undefined &&
    selection.line !== "" &&
    !selectionChinese.includes(
      String(selection.line)
    )
  ){

    selectionChinese +=
      " " +
      selection.line;
  }

  const rawMarket =
    market.market ||
    market.canonical ||
    "比赛盘口";

  selectedBet = {

    event_id:
      event.event_id ||
      event.id ||
      "",

    sport:
      event.sport ||
      event.category ||
      "",

    league:
      typeof (
        event.league ||
        event.competition
      ) === "string"
        ? (
            event.league ||
            event.competition ||
            ""
          )
        : "",

    home_team:
      teams.home,

    away_team:
      teams.away,

    /*
      数据库存中文显示名。
      当前为模拟下注，不影响Oddiwire。
    */
    market:
      translateMarket(
        rawMarket
      ),

    selection:
      selectionChinese,

    odds:
      Number(
        selection.price
      )
  };

  renderSlip();
  openBetModal();
}

/* =========================================================

function openBetModal(){

  if(!selectedBet)

    "modalMatch"
  ).textContent =
    selectedBet.home_team +
    " VS " +
    selectedBet.away_team;

  document.getElementById(
    "modalSelection"
  ).textContent =
    selectedBet.market +
    " · " +
    selectedBet.selection;

  document.getElementById(
    "modalOdds"
  ).textContent =

    selectedBet.odds.toFixed(2);

  document.getElementById(
    "stakeInput"
  ).value = "";

  document.getElementById(
    "returnValue"
  ).textContent =

  document.getElementById(
    "betModal"

    "show"
  );
}


function closeBetModal(){

  document.getElementById(
    "betModal"
  ).classList.remove(
    "show"
  );
}


function quickStake(amount){

  document.getElementById(
    "stakeInput"
  ).value = amount;

  calculateReturn();
}


function calculateReturn(){

  if(!selectedBet)
    return;

  const stake =
    Number(
      document.getElementById(
        "stakeInput"
      ).value
    ) || 0;

  const value =
    stake *
    selectedBet.odds;

  document.getElementById(
    "returnValue"
  ).textContent =
    value.toFixed(2) +
    " USDT";
}


/* =========================================================
   提交模拟投注
========================================================= */

async function submitBet(){

  if(!selectedBet)
    return;

  const stake =
    Number(
      document.getElementById(
        "stakeInput"
      ).value
    );

  if(
    !stake ||
    stake <= 0
  ){

    toast(
      "请输入正确的投注金额"
    );

    return;
  }

  const button =
    document.getElementById(
      "submitBetBtn"
    );

  button.disabled = true;

  button.textContent =
    "正在提交...";

  try{

    const data =
      await apiFetch(
        "/api/bet",
        {
          method:"POST",

          body:JSON.stringify({
            ...selectedBet,
            stake:stake,
            init_data:initData
          })
        }
      );

    if(account){

      account.balance =
        data.balance;
    }

    updateAccountUI();

    closeBetModal();

    selectedBet = null;

    renderSlip();

    toast(
      "✅ 模拟投注成功"
    );

    await loadBets();

  }catch(error){

    toast(
      error.message ||
      "投注失败"
    );

  }finally{

    button.disabled = false;

    button.textContent =
      "确认模拟投注";
  }
}

            "active"

/* =========================================================
   工具
========================================================= */

function escapeHtml(value){

  return String(
    value ?? ""
  )
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );
}


function toast(message){

  const element =
    document.getElementById(
      "toast"
    );

  element.textContent =
    message;

  element.classList.add(
    "show"
  );

  setTimeout(
    ()=>{

      element.classList.remove(
        "show"
      );

    },
    2500
  );
}


function showFatal(message){

  const loading =
    document.getElementById(
      "authLoading"
    );

  loading.innerHTML = `
    <div class="auth-logo">
      !
    </div>

    <div class="auth-title">
      无法进入
    </div>

    <div
      class="auth-text"
      style="
        max-width:280px;
        text-align:center;
        line-height:1.7
      "
    >
      ${escapeHtml(
        message
      )}
    </div>
  `;
}

   启动
========================================================= */

  const ok =
    initTelegram();

  if(!ok)
    return;

  await loadAccount();
}

boot();
