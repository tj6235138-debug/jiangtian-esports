<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070a0e"><title>麦天电竞</title><style>
*{box-sizing:border-box}body{margin:0;background:#070a0e;color:#f3f3f3;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:76px}header{padding:22px 18px 16px;background:linear-gradient(145deg,#090d12,#111820);border-bottom:1px solid #252a31}header b{font-size:25px;color:#f1c552}header small{display:block;color:#9d8950;margin:3px 0 18px}.balance{background:#11161d;padding:15px;border-radius:12px;color:#999}.balance strong{display:block;color:#fff;font-size:22px;margin-top:4px}nav{display:flex;overflow:auto;padding:10px 12px;border-bottom:1px solid #1c2229;gap:8px}button{border:0;background:#151a21;color:#aaa;border-radius:8px;padding:10px 13px}nav .active,.confirm{background:linear-gradient(135deg,#f8db72,#d9a72e);color:#090909;font-weight:800}.tabs{display:flex;gap:24px;padding:17px 16px;color:#888}.tabs b{color:#e9c452}.match{margin:0 12px 12px;padding:15px;background:#10151b;border:1px solid #181f27;border-radius:12px}.meta{color:#9299a3;font-size:12px}.live{color:#fff;background:#e52b38;padding:2px 6px;border-radius:4px;margin-right:6px}.teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;text-align:center;font-size:16px;margin:17px 0}.teams strong{font-size:20px}.odds{display:grid;grid-template-columns:1fr 1fr;gap:9px}.odd{font-size:18px;color:#f3cc58}.slip{position:fixed;left:0;right:0;bottom:-500px;background:#11161d;border-top:1px solid #343b44;padding:20px;z-index:5;border-radius:20px 20px 0 0;transition:.25s}.slip.open{bottom:0}.x{float:right;font-size:20px}.amounts{display:flex;gap:8px;margin:16px 0}.amounts button{flex:1}input{width:100%;padding:14px;background:#080b0f;border:1px solid #343b44;border-radius:8px;color:#fff;font-size:16px}.confirm{width:100%;font-size:16px;padding:14px}footer{position:fixed;bottom:0;left:0;right:0;height:68px;background:#090d11;border-top:1px solid #222831;display:flex;z-index:3}footer button{flex:1;background:none;color:#d7b64c;font-size:19px}footer small{display:block;font-size:11px;color:#999;margin-top:4px}
</style></head><body><header><div><b>♞ 麦天电竞</b><small>MAITIAN ESPORTS · 模拟版</small></div><div class="balance">模拟余额 <strong id="bal">10,000.00</strong> USDT</div></header><nav id="games"><button class="active">全部</button><button>LOL</button><button>CS2</button><button>DOTA2</button><button>VALORANT</button></nav><main><div class="tabs"><b>热门赛事</b><span>即将开赛</span><span>滚球赛事</span></div><section id="list"></section></main><div class="slip" id="slip"><button class="x" onclick="closeSlip()">×</button><h2>模拟投注单</h2><div id="pick"></div><div class="amounts"><button onclick="setAmt(100)">100</button><button onclick="setAmt(500)">500</button><button onclick="setAmt(1000)">1000</button></div><input id="amt" type="number" placeholder="请输入模拟金额"><p>预计返还：<strong id="ret">0.00</strong> USDT</p><button class="confirm" onclick="placeBet()">确认模拟投注</button></div><footer><button>◆<small>赛事</small></button><button>◉<small>滚球</small></button><button onclick="showBets()">▣<small>注单</small></button><button>♙<small>我的</small></button></footer><script src="https://telegram.org/js/telegram-web-app.js"></script><script>
const matches=[{id:1,status:'LIVE',game:'LOL',league:'LCK',bo:'BO3',clock:'12:48',a:'T1',b:'GEN',score:'1 : 0',oa:1.72,ob:2.05},{id:2,status:'即将开赛',game:'CS2',league:'ESL Pro League',bo:'BO3',clock:'20:00',a:'NAVI',b:'Vitality',score:'—',oa:1.88,ob:1.91},{id:3,status:'即将开赛',game:'DOTA2',league:'DreamLeague',bo:'BO3',clock:'21:30',a:'Team Spirit',b:'Falcons',score:'—',oa:1.66,ob:2.18},{id:4,status:'LIVE',game:'VALORANT',league:'VCT',bo:'BO3',clock:'08:21',a:'Paper Rex',b:'Sentinels',score:'0 : 1',oa:2.10,ob:1.69}];let selected=null,bets=[];const $=s=>document.querySelector(s);if(window.Telegram?.WebApp){Telegram.WebApp.ready();Telegram.WebApp.expand();}
function render(data){$('#list').innerHTML=data.map(m=>`<article class="match"><div class="meta"><span class="${m.status==='LIVE'?'live':''}">${m.status}</span> ${m.game} · ${m.league}　${m.bo} ${m.clock}</div><div class="teams"><span>${m.a}</span><strong>${m.score}</strong><span>${m.b}</span></div><div class="odds"><button onclick="pick(${m.id},'a')">${m.a}　<span class="odd">${m.oa.toFixed(2)}</span></button><button onclick="pick(${m.id},'b')">${m.b}　<span class="odd">${m.ob.toFixed(2)}</span></button></div></article>`).join('')}
function pick(id,side){let m=matches.find(x=>x.id===id),team=side==='a'?m.a:m.b,odds=side==='a'?m.oa:m.ob;selected={m,team,odds};$('#pick').innerHTML=`<b>${team} @ ${odds.toFixed(2)}</b><p>${m.a} vs ${m.b} · ${m.league}</p>`;$('#slip').classList.add('open');calc()}function closeSlip(){$('#slip').classList.remove('open')}function setAmt(v){$('#amt').value=v;calc()}function calc(){let a=Number($('#amt').value||0);$('#ret').textContent=(a*(selected?.odds||0)).toFixed(2)}$('#amt').oninput=calc;function placeBet(){let a=Number($('#amt').value||0);if(!selected||a<=0)return alert('请输入模拟金额');bets.unshift({...selected,amount:a});localStorage.setItem('maitian_demo_bets',JSON.stringify(bets));alert('模拟注单已提交');closeSlip()}function showBets(){alert(bets.length?bets.map(b=>`${b.team} @${b.odds} · ${b.amount} USDT`).join('\n'):'暂无模拟注单')}try{bets=JSON.parse(localStorage.getItem('maitian_demo_bets')||'[]')}catch(e){}$('#games').onclick=e=>{if(e.target.tagName!=='BUTTON')return;[...$('#games').children].forEach(x=>x.classList.remove('active'));e.target.classList.add('active');let g=e.target.textContent;render(g==='全部'?matches:matches.filter(m=>m.game===g))};render(matches);
</script></body></html>
